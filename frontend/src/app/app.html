<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <a class="brand__title" routerLink="/warehouses">Inventory Operations</a>
      <p class="brand__subtitle">Angular client for the Spring backend services</p>
    </div>

    <nav class="nav-strip" aria-label="Primary">
      @for (item of navItems; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }">
          {{ item.label }}
        </a>
      }
    </nav>
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
